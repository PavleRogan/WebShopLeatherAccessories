
  <div class="d-flex justify-content-center mt-5">
    <div class="col-3">
        <form class="form-signin" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <h1 class="h3 mb-4 font-weight-normal naslov" style="text-align: center;">Please sign in</h1>
            <label for="inputEmail" class="sr-only">Email address</label>
            <input formControlName="email" type="email" id="inputEmail" class="form-control" placeholder="Email address" required="" autofocus="">
            <label for="inputPassword" class="sr-only">Password</label>
            <input formControlName="password" type="password" id="inputPassword" class="form-control" placeholder="Password" required="">
            <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
            <p class="mt-5 mb-3 text-muted">© 2017-2018</p>
          </form>
    </div>
  
  </div>
