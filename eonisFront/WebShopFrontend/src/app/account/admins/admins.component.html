<div class="filter-container" >
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Unesi pojam..." #input>
    </mat-form-field>
    <button type="button" mat-raised-button color="primary" (click)="openAdminDialog(false)" class="add-product-btn btn btn-primary">Add Product</button>
  </div>
<div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>

        <ng-container matColumnDef="adminId">
            <th mat-header-cell mat-sort-header *matHeaderCellDef> Id </th>
            <td mat-cell *matCellDef="let element"> {{element.adminId}} </td>
          </ng-container>

      <ng-container matColumnDef="username">
        <th mat-header-cell mat-sort-header *matHeaderCellDef> Username </th>
        <td mat-cell *matCellDef="let element"> {{element.username}} </td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell mat-sort-header *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>
      <ng-container matColumnDef="surname">
        <th mat-header-cell mat-sort-header *matHeaderCellDef> Surname </th>
        <td mat-cell *matCellDef="let element"> {{element.surname}} </td>
      </ng-container>
      <ng-container matColumnDef="contact">
        <th mat-header-cell mat-sort-header *matHeaderCellDef> Contact </th>
        <td mat-cell *matCellDef="let element"> {{element.contact}} </td>
      </ng-container>
  
    
      <ng-container matColumnDef="action">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>  </th>
        <td mat-cell *matCellDef="let element">
            <div style="display: flex;">
                <button mat-icon-button class="custom-delete-btn mr-2" (click)="onDeleteAdmin(element.adminId,element.username)">
                    <mat-icon  color="warn">delete</mat-icon>
                </button>
                <button mat-icon-button class="custom-delete-btn" (click)="openAdminDialog(true)">
                    <mat-icon  color="primary">edit</mat-icon>
                </button></div> 
            
         </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons
                   aria-label="Select page of periodic elements">
    </mat-paginator>
  </div>
