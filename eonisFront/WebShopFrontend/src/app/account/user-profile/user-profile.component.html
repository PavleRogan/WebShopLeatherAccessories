<div class="user-profile">
    <h2>User Profile</h2>
    <div class="user-details">
      <div class="detail">
        <label for="name">Name:</label>
        <input type="text" id="name" [(ngModel)]="currentUser!.name">
      </div>
      <div class="detail">
        <label for="contact">Contact:</label>
        <input type="text" id="contact" [(ngModel)]="currentUser!.contactNumber">
      </div>
      <div class="detail">
        <label for="email">Email:</label>
        <input type="email" id="email" [(ngModel)]="currentUser!.email" disabled>
      </div>
      <div class="detail">
        <label for="city">City:</label>
        <input type="text" id="city" [(ngModel)]="currentUser!.city">
      </div>
      <div class="detail">
        <label for="street">Street and Number:</label>
        <input type="text" id="street" [(ngModel)]="currentUser!.streetAndNumber">
      </div>
      <div class="detail">
        <label for="postalCode">Postal Code:</label>
        <input type="text" id="postalCode" [(ngModel)]="currentUser!.postalCode">
      </div>
      <div class="user-orders">
          <h3 class="mt-3">Orders:</h3>
          <ul>
              <li *ngFor="let order of currentUser!.orders">
                <p><strong>Order ID:</strong> {{ order.orderId }}</p>
                <p><strong>Order Date:</strong> {{ order.orderDate | date }}</p>
            </li>
        </ul>
        <button class="edit-button" (click)="onEdit()">Save Changes</button>    </div>
    </div>
  </div>
