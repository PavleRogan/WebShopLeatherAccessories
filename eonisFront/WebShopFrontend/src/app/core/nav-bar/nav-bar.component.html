<header class="d-flex flex-row align-items-center justify-content-between p-3 px-4 mb-3 
    bg-white border-bottom fixed-top shadow-sm">
    <img src="/assets/images/logo.png" alt="logo" class="logo" style="max-height: 70px;" routerLink="/" routerLinkActive="active"
   >
    <nav class="my-2 text-uppercase fs-4">
        <a class="p-2" routerLink="/" routerLinkActive="active"  [routerLinkActiveOptions]="{exact: true}"
        >Home</a>
        <a class="p-2" [routerLink]="[ '/shop' ]" routerLinkActive="active">Shop</a>
        <ng-container *ngIf="(currentUser$ | async) as currentUser">
            <ng-container *ngIf="isAdmin(currentUser)">
                <a class="p-2">Orders</a>
            </ng-container>
        </ng-container>
    </nav>
    <div class="d-flex align-items-center">
        <a routerLink="/basket" class="position-relative">
            <i class="fa fa-shopping-cart fa-2x me-5 text-dark"></i>
            
        </a>
        <ng-container *ngIf="(currentUser$ | async) === null">
            <a routerLink="/account/login" class="btn btn-outline-secondary me-2">Login</a>
            <a routerLink="/account/register" class="btn btn-outline-secondary me-3">Sign up</a>
        </ng-container>

        <ng-container *ngIf="currentUser$ | async">
            <div class="dropdown ms-3 me-5" style="cursor: pointer;" dropdown>
                <a dropdownToggle class="dropdown-toggle">
                    <strong>Welcome {{currentUser?.email}}</strong>
                </a>
                <ul *dropdownMenu class="dropdown-menu dropdown-menu-right">
                    <li class="py-1">
                        <a routerLink="/basket" class="dropdown-item">
                            <i class="fa fa-shopping-cart me-3"></i> View basket
                        </a>
                    </li>
            
                    <li class="py-1">
                        <ng-container *ngIf="(currentUser$ | async) as currentUser">
                            <ng-container *ngIf="!isAdmin(currentUser)">
                                <a routerLink="/account/profile" class="dropdown-item">
                                    <i class="fa fa-history me-3"></i> View profile
                                </a> 
                            </ng-container>
                        </ng-container>
                    </li>
                    <div class="dropdown-divider"></div>
                    <li class="py-1">
                        <a  class="dropdown-item" (click)="onLogOut()">
                            <i class="fa fa-sign-out me-3"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </ng-container>

    </div>

</header>
